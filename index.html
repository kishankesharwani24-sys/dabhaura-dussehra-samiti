<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>डभौरा दशहरा समिति</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#fff1d0,#ffcf8b);
    color:#4b1d00;
}

.container{
    max-width:650px;
    margin:auto;
    padding:25px 15px;
}

.card{
    background:white;
    border-radius:25px;
    padding:30px 22px;
    box-shadow:0 10px 35px rgba(0,0,0,0.18);
}

.jai{
    text-align:center;
    font-size:20px;
    font-weight:bold;
    color:#c03900;
    margin-bottom:12px;
}

h1{
    text-align:center;
    font-size:32px;
    margin:5px 0;
    color:#8b2500;
}

.subtitle{
    text-align:center;
    font-size:16px;
    color:#b04b00;
    margin-bottom:28px;
}

.divider{
    height:3px;
    background:#f0a23a;
    border-radius:10px;
    margin-bottom:10px;
}

.info{
    padding:20px 5px;
    border-bottom:1px solid #eee;
}

.info:last-child{
    border-bottom:none;
}

.label{
    font-size:15px;
    font-weight:bold;
    color:#a04a00;
    margin-bottom:7px;
}

.value{
    font-size:20px;
    font-weight:500;
}

.phone{
    display:inline-block;
    margin:7px 5px 0 0;
    padding:12px 16px;
    background:#fff0dc;
    border-radius:12px;
    color:#702900;
    text-decoration:none;
    font-weight:bold;
}

.footer{
    text-align:center;
    margin-top:25px;
    padding-top:18px;
    border-top:1px solid #eee;
    color:#777;
    font-size:14px;
}

.emoji{
    font-size:22px;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="jai">
॥ जय श्री राम ॥
</div>

<h1>डभौरा दशहरा समिति</h1>

<div class="subtitle">
धर्म की विजय, अधर्म का नाश
</div>

<div class="divider
